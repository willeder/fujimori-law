                type: string
            X-FRAME-OPTIONS:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: 
                    type: string
                    description: 非同期実行インスタンスID
                  effects:
                    type: integer
                    description: 受け入れ件数
                  status:
                    type: string
                    enum: [applied, scceeded, warned, failed]
                    description: >
                      非同期実行状況
                      
                      `applied` - 受け入れ済み
                      `scceeded` - 正常に完了
                      `warned` - 失敗を含む完了
                      `failed` - 失敗
                  errors: 
                    type: array
                    items:
                      type: object
                      properties:
                        externalId:
                          type: string
                          description: リクエスト時に指定したexternalId。指定がない場合は未設定
                        message:
                          type: string
                          description: 失敗の理由
                        sequence:
                          type: integer
                          description: 失敗したリクエストの順序。リクエスト時のリスト添字。
                      required:
                        - message
                        - sequence
